<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木木牧牧牙醫｜員工打卡</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f5f3ef;
      margin: 0;
      padding: 24px;
      color: #333;
    }
    .container {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #00000010;
      text-align: center;
    }
    h1 { font-size: 25px; margin-bottom: 8px; }
    .site { color: #777; margin-bottom: 28px; }
    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      background: #536b5c;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #status { margin-top: 20px; color: #666; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>木木牙醫｜牧牧牙醫</h1>
    <div class="site" id="siteName">員工打卡系統</div>
    <div id="googleSignInButton"></div>

   <button onclick="alert('早診上班：下一步啟用')">早診上班</button>
<button onclick="alert('早診下班：下一步啟用')">早診下班</button>
<button onclick="alert('午診上班：下一步啟用')">午診上班</button>
<button onclick="alert('午診下班：下一步啟用')">午診下班</button>
<button onclick="alert('晚診上班：下一步啟用')">晚診上班</button>
<button onclick="alert('晚診下班：下一步啟用')">晚診下班</button>

    <div id="status">請確認目前所在院區</div>
  </div>

  <script>
  const site = new URLSearchParams(location.search).get("site");

  const names = {
    Yilan: "宜蘭木木牙醫",
    Luodong: "羅東牧牧牙醫"
  };

  document.getElementById("siteName").textContent =
    names[site] || "請由診所 NFC 感應進入";

  function initializeGoogleLogin() {
    google.accounts.id.initialize({
      client_id: "754861408537-j0lseftm03eppt6shq042bg55nqnrost.apps.googleusercontent.com",
      callback: handleGoogleLogin
    });

    google.accounts.id.renderButton(
      document.getElementById("googleSignInButton"),
      {
        theme: "outline",
        size: "large",
        text: "signin_with",
        shape: "rectangular",
        width: 280
      }
    );
  }

  function handleGoogleLogin(response) {
    const payload = response.credential.split(".")[1];
    const decoded = JSON.parse(
      decodeURIComponent(
        atob(payload.replace(/-/g, "+").replace(/_/g, "/"))
          .split("")
          .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      )
    );

    document.getElementById("status").textContent =
      "Google 登入測試完成：" + decoded.email +
      "。目前尚未啟用正式打卡功能。";
  }
</script>

<script
  src="https://accounts.google.com/gsi/client"
  async
  defer
  onload="initializeGoogleLogin()">
</script>
</body>
</html>
