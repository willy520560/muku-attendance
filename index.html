<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木木牙醫｜員工打卡</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f5f3ef;
      margin: 0;
      padding: 24px;
      color: #333;
    }
    .container {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #00000010;
      text-align: center;
    }
    h1 { font-size: 25px; margin-bottom: 8px; }
    .site { color: #777; margin-bottom: 28px; }
    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      background: #536b5c;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #status { margin-top: 20px; color: #666; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>木木牙醫</h1>
    <div class="site" id="siteName">員工打卡系統</div>

    <button onclick="alert('下一步完成登入功能後啟用')">上班打卡</button>
    <button onclick="alert('下一步完成登入功能後啟用')">開始午休</button>
    <button onclick="alert('下一步完成登入功能後啟用')">結束午休</button>
    <button onclick="alert('下一步完成登入功能後啟用')">下班打卡</button>

    <div id="status">請確認目前所在院區</div>
  </div>

  <script>
    const site = new URLSearchParams(location.search).get("site");
    const names = {
      Yilan: "宜蘭院區",
      Luodong: "羅東院區"
    };
    document.getElementById("siteName").textContent =
      names[site] || "請由診所 NFC 感應進入";
  </script>
</body>
</html>
